name: Deploy to GitHub Pages

# Publishes the site on every merge into main. The site is rebuilt from the
# Markdown sources here rather than served from the committed docs/ folder, so
# what goes live always matches the source in the merge commit.
on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you re-publish by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published, but
# queue at most one more so rapid merges do not pile up.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the site
        run: node build.js

      - name: Validate links, anchors, quizzes and search index
        run: node scripts/check-links.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
